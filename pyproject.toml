[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"

[project]
name = "django-health-check-full-of-juice"
# Placeholder. The publication workflow runs `poetry version $TAG_NAME` to set the real version from the git tag.
version = "0.0.0"
description = "Opinionated health checks for Django applications"
readme = { file = "README.md", content-type = "text/markdown" }
license = { file = "LICENSE" }
authors = [
    {name = "Tinuvi", email = "no-reply@tinuvi.com"}
]

[tool.poetry]
packages = [{ include = "health_check" }]

[project.urls]
repository = "https://github.com/tinuvi/django-health-check-full-of-juice"
"Bug Tracker" = "https://github.com/tinuvi/django-health-check-full-of-juice/issues"

[tool.poetry.dependencies]
python = "^3.12"
django = "^5.2.11"

[tool.poetry.group.dev.dependencies]
coverage = "~=7.13"
pyrefly = "~=0.64"
ruff = "^0.15.2"
mypy = "^1.20.2"
django-stubs = "~=6.0"
types-requests = "^2.33.0.20260408"
mutmut = "^3.5.0"
celery = "*"
redis = "*"
django-storages = "*"
boto3 = "*"
psutil = "*"
django-q2 = "~=1.9"
unittest-xml-reporting = "~=4.0"

[tool.ruff]
line-length = 120
target-version = "py314"
extend-exclude = ["scripts", ".github/workflows"]

[tool.ruff.lint]
select = [
    "D", # pydocstyle
    "E", # pycodestyle errors
    "EXE", # flake8-executable
    "F", # pyflakes
    "I", # isort
    "S", # flake8-bandit
    "SIM", # flake8-simplify
    "UP", # pyupgrade
    "W", # pycodestyle warnings
]
ignore = [
    "E501", # line too long, formatter will handle this
    "SIM117", # Use a single `with` statement with multiple contexts instead of nested `with` statements
    "D1",
    "D203",
    "D212",
]

[tool.pyrefly.errors]
bad-override-param-name = false

[tool.pyrefly]
python-version = "3.14"
project-includes = ["health_check"]
project-excludes = [
    "**/migrations/**",
    "**/__pycache__",
    "**/*venv/**",
    ".github/workflows/test_pypi_publish.py",
]
check-unannotated-defs = false
infer-return-types = "checked"
permissive-ignores = true

[tool.mutmut]
paths_to_mutate = ["health_check"]
pytest_add_cli_args_test_selection = [
    "tests/test_views.py",
]
also_copy = ["conftest.py"]
type_check_command = ["pyrefly", "check", "--output-format=json"]
debug = false